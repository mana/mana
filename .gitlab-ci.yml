stages:
  - build

ubuntu-build:
  stage: build
  parallel:
    matrix:
      - UBUNTU_VERSION: "22.04"
      - UBUNTU_VERSION: "24.04"
      - UBUNTU_VERSION: "26.04"
  image: ubuntu:$UBUNTU_VERSION
  cache:
    paths:
      - ccache
      # Downloaded by the AppImage packaging script, which skips the
      # download when the file is already present
      - linuxdeploy-x86_64.AppImage
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  before_script:
    - export CCACHE_BASEDIR="$PWD"
    - export CCACHE_DIR="$PWD/ccache"
    - export CCACHE_COMPILERCHECK=content
  script:
    - export DEBIAN_FRONTEND=noninteractive
    # dpkg fsyncs after every package, which is pointless in a container
    - echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/02speedup
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential
        ca-certificates
        ccache
        cmake
        file
        gettext
        libcurl4-openssl-dev
        libenet-dev
        libguichan-dev
        libphysfs-dev
        libpng-dev
        libsdl2-dev
        libsdl2-image-dev
        libsdl2-mixer-dev
        libsdl2-net-dev
        libsdl2-ttf-dev
        libxml2-dev
        ninja-build
        wget
    - ccache --zero-stats || true
    - cmake -G Ninja -B build . -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
    - cmake --build build
    - ccache --show-stats
    # Package the oldest still-supported build as an AppImage, since
    # AppImages should be built against the oldest supported glibc
    - if [ "$UBUNTU_VERSION" = "22.04" ]; then ./packaging/appimage/build-appimage.sh; fi
  artifacts:
    name: "appimage-$CI_COMMIT_REF_SLUG"
    paths:
      - Mana-*.AppImage

windows-cross-build:
  stage: build
  # Fedora packages a complete mingw-w64 toolchain, so the Windows installer
  # can be cross-compiled in an ordinary container. The installer shipped to
  # users is still the MSYS2 one built by AppVeyor.
  image: fedora:44
  cache:
    paths:
      - ccache
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  before_script:
    - export CCACHE_BASEDIR="$PWD"
    - export CCACHE_DIR="$PWD/ccache"
    - export CCACHE_COMPILERCHECK=content
  script:
    # mingw32-nsis provides the 32-bit stubs makensis needs, also for a 64-bit
    # installer, while mingw64-nsis provides the 64-bit plugins
    - dnf install -y --setopt=install_weak_deps=False
        ccache cmake gettext git ninja-build
        mingw64-gcc-c++ mingw64-filesystem mingw64-winpthreads-static
        mingw64-sdl2-compat mingw64-SDL2_image mingw64-SDL2_mixer
        mingw64-SDL2_ttf mingw64-physfs mingw64-curl mingw64-libxml2
        mingw64-zlib mingw64-gettext mingw32-nsis mingw64-nsis
    # SDL2_net has no mingw package, so build it from source. It only installs
    # its pkg-config file for a Release build. Note that mingw64-cmake takes the
    # source directory from the working directory, so -S can not be used here.
    - git clone --depth 1 -b release-2.2.0 https://github.com/libsdl-org/SDL_net
    - cd SDL_net
    - mingw64-cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
        -DSDL2NET_SAMPLES=OFF
    - cmake --build build
    - cmake --install build
    - cd ..
    - ccache --zero-stats || true
    # ENet has no mingw package either, so use the submodule for it as well
    - mingw64-cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
        -DUSE_SYSTEM_GUICHAN=OFF -DUSE_SYSTEM_ENET=OFF
        -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    - cmake --build build
    - ccache --show-stats
    - cpack --config build/CPackConfig.cmake
  artifacts:
    name: "windows-installer-$CI_COMMIT_REF_SLUG"
    paths:
      - Mana-*-win64.exe

macos-build:
  stage: build
  allow_failure: true
  tags:
    - macos
  variables:
    GIT_SUBMODULE_STRATEGY: normal
  script:
    - cmake -G Ninja -B build .
    - cmake --build build
    - cd build
    - cpack -G DragNDrop
    # No version in the file name, since CPack always stamps the static
    # project version, and a stable name gives the latest artifact a stable
    # download URL usable on the website
    - mv Mana-*.dmg ../Mana.dmg
  artifacts:
    name: "macos-dmg-$CI_COMMIT_REF_SLUG"
    paths:
      - Mana.dmg
