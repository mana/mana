<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mana</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    background: #5a5044;
    color: #e6dfd5;
    font: 14px/1.5 system-ui, sans-serif;
  }
  canvas {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: hidden;
    background: #5a5044;
  }
  canvas:focus { outline: none; }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #5a5044;
    text-align: center;
  }
  #overlay.hidden { display: none; }
  #title {
    font-size: 22px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #b8a27e;
  }
  #status { min-height: 1.5em; }
  a { color: #f0d492; }
  a:hover { color: #f7e4b0; }
  #progress {
    width: 280px;
    height: 6px;
    border-radius: 3px;
    background: #463e34;
    overflow: hidden;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: #d9b45b;
    transition: width 0.15s linear;
  }
  #progress.hidden { visibility: hidden; }
</style>
</head>
<body>

<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<div id="overlay">
  <div id="title">Mana</div>
  <div id="status">Loading...</div>
  <div id="progress"><div id="progressBar"></div></div>
</div>

<script>
(function () {
  var overlay = document.getElementById('overlay');
  var statusElement = document.getElementById('status');
  var progressElement = document.getElementById('progress');
  var progressBar = document.getElementById('progressBar');
  var canvas = document.getElementById('canvas');

  var params = new URLSearchParams(window.location.search);

  // Deployment defaults, filled in by CMake (MANA_WEB_PROXY_URL and
  // MANA_WEB_UPDATE_HOST). Empty when not configured.
  var buildProxyUrl = @MANA_WEB_PROXY_URL@;
  var buildUpdateHost = @MANA_WEB_UPDATE_HOST@;
  var buildServer = @MANA_WEB_SERVER@;
  var buildPort = @MANA_WEB_PORT@;

  // Base URL of the WebSocket-to-TCP proxy used to reach tmwAthena servers.
  // Only set when the page names one explicitly, so that the client can tell
  // this case apart from a server list in which every server names its own
  // WebSocket URL. Without either, the client assumes the page origin with a
  // ws/wss scheme and a "/tmwa/" path.
  var proxyUrl = params.get('proxy') || buildProxyUrl;

  // Command line arguments are taken from the query string, so that a link can
  // point straight at a server.
  function buildArguments() {
    var args = [];
    var server = params.get('server') || buildServer;
    var port = params.get('port') || buildPort;
    if (server) args.push('-s', server);
    if (port) args.push('-p', port);
    if (params.has('skip-update')) args.push('-u');
    var updateHost = params.get('update-host') || buildUpdateHost;
    if (updateHost) args.push('--update-host', updateHost);
    if (params.has('default')) args.push('-D');
    return args;
  }

  var totalDependencies = 0;

  var Module = {
    canvas: canvas,
    arguments: buildArguments(),

    setStatus: function (text) {
      if (Module.setStatus.last === text) return;
      Module.setStatus.last = text;

      // Emscripten reports progress as "text (current/total)"
      var match = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(text);
      if (match) {
        statusElement.textContent = match[1].trim();
        progressElement.classList.remove('hidden');
        progressBar.style.width = (100 * parseFloat(match[2]) / parseFloat(match[4])) + '%';
      } else {
        statusElement.textContent = text;
        if (!text) {
          overlay.classList.add('hidden');
        } else {
          progressElement.classList.add('hidden');
        }
      }
    },

    monitorRunDependencies: function (left) {
      totalDependencies = Math.max(totalDependencies, left);
      if (left) {
        Module.setStatus('Preparing... (' + (totalDependencies - left) + '/' + totalDependencies + ')');
      } else {
        Module.setStatus('');
      }
    },

    print: function () {
      console.log(Array.prototype.join.call(arguments, ' '));
    },

    printErr: function () {
      console.error(Array.prototype.join.call(arguments, ' '));
    },

    onAbort: function (what) {
      console.error('Mana aborted:', what);
      overlay.classList.remove('hidden');
      progressElement.classList.add('hidden');
      statusElement.textContent = 'Something went wrong: ' + what;
    }
  };

  if (proxyUrl) Module.manaProxyUrl = proxyUrl;

  Module.setStatus('Loading...');
  window.Module = Module;

  window.onerror = function (message) {
    Module.setStatus('Exception thrown, see the browser console');
    console.error(message);
  };
})();
</script>

<!-- Inert until cloned into the page below -->
<template id="mana-script">
{{{ SCRIPT }}}
</template>

<script>
(function () {
  var statusElement = document.getElementById('status');
  var progressElement = document.getElementById('progress');

  // Load the client only when the browser supports WebGL 2, which the build
  // requires. This also spares WebGL 1 users the download.
  function load() {
    if (!document.createElement('canvas').getContext('webgl2')) {
      progressElement.classList.add('hidden');
      statusElement.innerHTML =
          'This browser does not support WebGL 2, which the web client ' +
          'requires. <a href="https://manasource.org/downloads">Download the ' +
          'native client</a> instead.';
      return;
    }

    statusElement.textContent = 'Loading...';
    var template = document.getElementById('mana-script');
    document.body.appendChild(template.content.cloneNode(true));
  }

  // On Android, suggest the native build first, which is looking for testers
  if (/Android/i.test(navigator.userAgent)) {
    progressElement.classList.add('hidden');
    statusElement.innerHTML =
        'An experimental Android version is available. Please help test it ' +
        'by installing it from <a href="https://manasource.org/downloads">' +
        'manasource.org/downloads</a>.<br><br>' +
        '<a href="#" id="use-browser">Continue in the browser</a>';
    document.getElementById('use-browser').onclick = function (event) {
      event.preventDefault();
      load();
    };
  } else {
    load();
  }
})();
</script>

</body>
</html>
